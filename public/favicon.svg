<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Premium Gradients for 3D Folded Leaf Effect -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2F5233" />
      <stop offset="100%" stop-color="#16281F" />
    </linearGradient>
    <linearGradient id="darkLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16281F" />
      <stop offset="100%" stop-color="#2F5233" />
    </linearGradient>
    <linearGradient id="lightLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F5233" />
      <stop offset="100%" stop-color="#5DA36A" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF0E4" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#2F5233" />
      <stop offset="100%" stop-color="#5DA36A" />
    </linearGradient>
  </defs>

  <!-- Outer Ring - Clean & Thin (Global Corporate Aesthetic) -->
  <circle cx="50" cy="50" r="43" fill="none" stroke="url(#ringGrad)" stroke-width="2" />
  
  <!-- Inner Ring - Subtle Accent -->
  <circle cx="50" cy="50" r="39" fill="none" stroke="#2F5233" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.5" />

  <!-- Monogram B (Leaves) -->
  <g transform="translate(3, 0)">
    <!-- Stem (Spine) -->
    <path d="M 33 16 L 33 84" fill="none" stroke="url(#stemGrad)" stroke-width="7" stroke-linecap="round" />
    
    <!-- Top Leaf (Folded) -->
    <!-- Left Half (Dark) -->
    <path d="M 33.5 20 C 48 20 54 28 50 48 C 42 46 37 46 33.5 48 Z" fill="url(#darkLeaf)" />
    <!-- Right Half (Light) -->
    <path d="M 33.5 20 C 58 20 66 30 50 48 L 33.5 48 Z" fill="url(#lightLeaf)" />
    <!-- Leaf Vein Divider -->
    <path d="M 33.5 20 Q 43 32 50 48" fill="none" stroke="#EAF0E4" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />

    <!-- Bottom Leaf (Folded) -->
    <!-- Left Half (Dark) -->
    <path d="M 33.5 48 C 50 48 56 56 52 80 C 43 78 37 78 33.5 80 Z" fill="url(#darkLeaf)" />
    <!-- Right Half (Light) -->
    <path d="M 33.5 48 C 62 48 70 60 52 80 L 33.5 80 Z" fill="url(#lightLeaf)" />
    <!-- Leaf Vein Divider -->
    <path d="M 33.5 48 Q 44 62 52 80" fill="none" stroke="#EAF0E4" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  </g>
</svg>