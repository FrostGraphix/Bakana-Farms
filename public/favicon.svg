<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="farmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C3F24" />
      <stop offset="50%" stop-color="#2F5233" />
      <stop offset="100%" stop-color="#68B277" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle with gradient -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#farmGrad)" stroke-width="5" />
  
  <!-- Inner dotted circle -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#farmGrad)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />

  <!-- B Emblem constructed of leaves -->
  <g transform="translate(4, 0)">
    <!-- Stem / Spine of B -->
    <path d="M 32 18 L 32 82" fill="none" stroke="url(#farmGrad)" stroke-width="9" stroke-linecap="round" />
    <path d="M 32 18 L 32 82" fill="none" stroke="#EAF0E4" stroke-width="2" stroke-linecap="round" opacity="0.4" />
    
    <!-- Top Leaf Loop -->
    <path d="M 32 20 C 65 14 80 40 54 50 C 42 50 35 46 32 48 Z" fill="url(#farmGrad)" />
    <!-- Top Leaf Vein -->
    <path d="M 32 20 Q 48 33 54 50" fill="none" stroke="#EAF0E4" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

    <!-- Bottom Leaf Loop -->
    <path d="M 32 48 C 68 44 85 72 56 82 C 44 82 35 78 32 80 Z" fill="url(#farmGrad)" />
    <!-- Bottom Leaf Vein -->
    <path d="M 32 48 Q 50 64 56 82" fill="none" stroke="#EAF0E4" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>