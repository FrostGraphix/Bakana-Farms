<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="farmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8CC72" />
      <stop offset="50%" stop-color="#B5602C" />
      <stop offset="100%" stop-color="#2F5233" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle with gradient -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#farmGrad)" stroke-width="3" />
  
  <!-- Inner dotted circle -->
  <circle cx="50" cy="50" r="39" fill="none" stroke="url(#farmGrad)" stroke-width="1" stroke-dasharray="3 3" opacity="0.8" />

  <!-- B Emblem constructed of leaves -->
  <g transform="translate(4, 0)">
    <!-- Stem / Spine of B -->
    <path d="M 32 20 Q 30 50 32 80" fill="none" stroke="url(#farmGrad)" stroke-width="5" stroke-linecap="round" />
    <path d="M 32 20 Q 30 50 32 80" fill="none" stroke="#E8CC72" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    
    <!-- Top Leaf Loop -->
    <path d="M 33 22 C 58 16 72 38 52 48 C 44 48 37 46 33 48 C 33 48 42 38 43 30 C 44 24 38 23 33 22 Z" 
          fill="url(#farmGrad)" />
    <!-- Top Leaf Vein -->
    <path d="M 33 22 Q 46 33 52 48" fill="none" stroke="#E8CC72" stroke-width="1.5" opacity="0.7" />

    <!-- Bottom Leaf Loop -->
    <path d="M 33 48 C 60 44 75 70 54 80 C 46 80 37 78 33 80 C 33 80 42 68 43 58 C 44 52 38 50 33 48 Z" 
          fill="url(#farmGrad)" />
    <!-- Bottom Leaf Vein -->
    <path d="M 33 48 Q 47 62 54 80" fill="none" stroke="#E8CC72" stroke-width="1.5" opacity="0.7" />
  </g>
</svg>