services:
  postgres:
    # Pulled from the AWS ECR Public mirror of the Docker Official
    # Images rather than Docker Hub, which stalls on this network.
    # Same upstream image, different registry.
    image: public.ecr.aws/docker/library/postgres:17-alpine
    container_name: bakana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bakana
      POSTGRES_PASSWORD: bakana_local_dev
      POSTGRES_DB: bakana
    ports:
      - "5433:5432"
    volumes:
      - bakana-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bakana -d bakana"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  bakana-pgdata:
